<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="8" fill="#0a0a0a"/>

  <!-- Neural network connections -->
  <line x1="8" y1="8" x2="16" y2="16" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="24" y1="8" x2="16" y2="16" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="8" y1="24" x2="16" y2="16" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>
  <line x1="24" y1="24" x2="16" y2="16" stroke="url(#grad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Outer nodes -->
  <circle cx="8" cy="8" r="3" fill="url(#grad)" opacity="0.8"/>
  <circle cx="24" cy="8" r="3" fill="url(#grad)" opacity="0.8"/>
  <circle cx="8" cy="24" r="3" fill="url(#grad)" opacity="0.8"/>
  <circle cx="24" cy="24" r="3" fill="url(#grad)" opacity="0.8"/>

  <!-- Center node (larger, brighter) -->
  <circle cx="16" cy="16" r="5" fill="url(#grad)"/>
  <circle cx="16" cy="16" r="3" fill="#ffffff" opacity="0.3"/>
</svg>
